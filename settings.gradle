// Gradle 8/9 的插件与依赖仓库声明。
// 注意：apksig 只在 Google Maven 上，不在 Maven Central。
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'wear-apk-swipe-patcher'
include ':app'
